    <script>
      // Apply the saved theme before first paint so there is never a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem('pn_theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var r = document.documentElement;
          if (t === 'dark') r.classList.add('dark'); else r.classList.remove('dark');
          r.dataset.theme = t;
          r.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
